<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Paper background -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d8b0"/>
      <stop offset="100%" stop-color="#c8b888"/>
    </linearGradient>
    <!-- Dark overlay for edges -->
    <radialGradient id="doc-vignette" cx="50%" cy="50%" r="65%">
      <stop offset="30%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0a0804" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Film grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
    </filter>
    <!-- Paper texture filter -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#e8d8b0" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="multiply"/>
    </filter>
  </defs>

  <!-- Dark background (room/desk surface) -->
  <rect width="1600" height="900" fill="#0a0804"/>

  <!-- Main document page (tilted slightly) -->
  <g transform="rotate(-2, 800, 450)">
    <rect x="380" y="60" width="840" height="1100" fill="url(#paper)" rx="2"/>
    <!-- Paper shadow -->
    <rect x="390" y="75" width="840" height="1100" fill="#0a0804" opacity="0.3" rx="2"/>
  </g>

  <!-- Main document (front, straight) -->
  <rect x="370" y="50" width="860" height="820" fill="#e8d8b0" rx="2"/>

  <!-- Document texture lines (simulating aged paper) -->
  <g stroke="#b89858" stroke-width="0.5" opacity="0.3">
    <line x1="370" y1="120" x2="1230" y2="120"/>
    <line x1="370" y1="200" x2="1230" y2="200"/>
    <line x1="370" y1="280" x2="1230" y2="280"/>
    <line x1="370" y1="360" x2="1230" y2="360"/>
    <line x1="370" y1="440" x2="1230" y2="440"/>
    <line x1="370" y1="520" x2="1230" y2="520"/>
    <line x1="370" y1="600" x2="1230" y2="600"/>
    <line x1="370" y1="680" x2="1230" y2="680"/>
    <line x1="370" y1="760" x2="1230" y2="760"/>
  </g>

  <!-- Official border frame -->
  <rect x="390" y="70" width="820" height="780" fill="none" stroke="#1a1408" stroke-width="3" opacity="0.4"/>
  <rect x="398" y="78" width="804" height="764" fill="none" stroke="#1a1408" stroke-width="1" opacity="0.25"/>

  <!-- Government seal (abstract circular) -->
  <g transform="translate(800, 155)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#2a2018" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#2a2018" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#2a2018" stroke-width="1" opacity="0.4"/>
    <!-- Eagle shape (simplified) -->
    <path d="M-22,-8 C-18,-20 -6,-24 0,-20 C6,-24 18,-20 22,-8 C18,-4 6,-8 0,-4 C-6,-8 -18,-4 -22,-8Z" fill="#2a2018" opacity="0.5"/>
    <!-- Wings -->
    <path d="M-40,2 C-32,-6 -22,-4 -15,2" fill="none" stroke="#2a2018" stroke-width="2" opacity="0.5"/>
    <path d="M40,2 C32,-6 22,-4 15,2" fill="none" stroke="#2a2018" stroke-width="2" opacity="0.5"/>
    <!-- Stars around seal -->
    <g fill="#2a2018" opacity="0.4">
      <polygon points="0,-50 2,-44 8,-44 3,-40 5,-34 0,-38 -5,-34 -3,-40 -8,-44 -2,-44"/>
      <polygon points="35,-35 37,-29 43,-29 38,-25 40,-19 35,-23 30,-19 32,-25 27,-29 33,-29"/>
      <polygon points="50,0 52,6 58,6 53,10 55,16 50,12 45,16 47,10 42,6 48,6"/>
      <polygon points="35,35 37,41 43,41 38,45 40,51 35,47 30,51 32,45 27,41 33,41"/>
      <polygon points="-35,35 -33,41 -27,41 -32,45 -30,51 -35,47 -40,51 -38,45 -43,41 -37,41"/>
      <polygon points="-50,0 -48,6 -42,6 -47,10 -45,16 -50,12 -55,16 -53,10 -58,6 -52,6"/>
      <polygon points="-35,-35 -33,-29 -27,-29 -32,-25 -30,-19 -35,-23 -40,-19 -38,-25 -43,-29 -37,-29"/>
    </g>
    <!-- Seal text (curved, simulated) -->
    <text font-family="serif" font-size="6" fill="#2a2018" opacity="0.45" text-anchor="middle">
      <textPath href="#seal-circle">SELECTIVE SERVICE SYSTEM · UNITED STATES OF AMERICA ·</textPath>
    </text>
  </g>
  <defs>
    <path id="seal-circle" d="M 800,103 a 52,52 0 1,1 -0.1,0"/>
  </defs>

  <!-- ── DOCUMENT TEXT ── (typewriter simulation) -->

  <!-- Header: SELECTIVE SERVICE SYSTEM -->
  <text x="800" y="232" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#1a1408" text-anchor="middle" opacity="0.85" letter-spacing="4">SELECTIVE SERVICE SYSTEM</text>

  <!-- Sub header -->
  <text x="800" y="258" font-family="'Courier New', monospace" font-size="11" fill="#2a2018" text-anchor="middle" opacity="0.7" letter-spacing="2">LOCAL BOARD NO. ___  ·  STATE OF ___________</text>

  <!-- Divider line -->
  <line x1="430" y1="272" x2="1170" y2="272" stroke="#1a1408" stroke-width="1.5" opacity="0.4"/>

  <!-- ORDER TO REPORT heading -->
  <text x="800" y="308" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#1a1408" text-anchor="middle" opacity="0.8" letter-spacing="3">ORDER TO REPORT FOR INDUCTION</text>

  <!-- Body text lines (simulated typewritten content) -->
  <text x="430" y="350" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">The President of the United States,</text>
  <text x="430" y="372" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">To: _______________________________________________</text>
  <text x="430" y="394" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">     (Name)</text>

  <text x="430" y="428" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.7">_______________________________________________</text>
  <text x="430" y="450" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.7">     (Street address or rural route)</text>

  <text x="430" y="490" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">GREETING: Having submitted yourself to a local board</text>
  <text x="430" y="512" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">composed of your neighbors for the purpose of</text>
  <text x="430" y="534" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">determining your availability for training and service</text>
  <text x="430" y="556" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">in the land or naval forces of the United States,</text>
  <text x="430" y="578" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">you are hereby ordered for induction into the Armed</text>
  <text x="430" y="600" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.75">Forces of the United States...</text>

  <!-- Report date line -->
  <text x="430" y="648" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.7">You will report at _________________________</text>
  <text x="430" y="670" font-family="'Courier New', monospace" font-size="12" fill="#2a2018" opacity="0.7">at _________ o'clock ____.m., on _________________, 196__</text>

  <!-- Signature area -->
  <line x1="430" y1="740" x2="720" y2="740" stroke="#1a1408" stroke-width="1" opacity="0.35"/>
  <text x="430" y="755" font-family="'Courier New', monospace" font-size="10" fill="#2a2018" opacity="0.6">Member or clerk of local board</text>

  <!-- DSS Form number -->
  <text x="1170" y="830" font-family="'Courier New', monospace" font-size="9" fill="#2a2018" opacity="0.5" text-anchor="end">DSS FORM 252  (Revised)</text>

  <!-- ── RUBBER STAMP: INDUCTION NOTICE ── -->
  <g transform="translate(920, 680) rotate(-15)">
    <rect x="-90" y="-25" width="180" height="50" fill="none" stroke="#6a1a1a" stroke-width="3" rx="3" opacity="0.75"/>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#6a1a1a" text-anchor="middle" opacity="0.75" letter-spacing="2">INDUCTION</text>
    <text x="0" y="18" font-family="'Courier New', monospace" font-size="12" fill="#6a1a1a" text-anchor="middle" opacity="0.75" letter-spacing="3">NOTICE</text>
  </g>

  <!-- Film grain overlay -->
  <rect width="1600" height="900" opacity="0.05" fill="white" filter="url(#grain)"/>

  <!-- Document vignette -->
  <rect width="1600" height="900" fill="url(#doc-vignette)"/>
</svg>
