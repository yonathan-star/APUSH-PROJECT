<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: horizon amber → deep blue -->
    <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c8842a"/>
      <stop offset="30%" stop-color="#8a7848"/>
      <stop offset="70%" stop-color="#4a5878"/>
      <stop offset="100%" stop-color="#2a3858"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5820"/>
      <stop offset="100%" stop-color="#1a2c10"/>
    </linearGradient>
    <!-- Road gradient -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2818"/>
      <stop offset="100%" stop-color="#1a1810"/>
    </linearGradient>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <!-- Horizon glow -->
    <radialGradient id="horizon-glow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#c8842a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Film grain filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="650" fill="url(#sky)"/>

  <!-- Horizon warm glow -->
  <rect y="560" width="1600" height="100" fill="url(#horizon-glow)"/>

  <!-- Distant tree line (far background) -->
  <ellipse cx="100" cy="580" rx="80" ry="55" fill="#1e3010"/>
  <ellipse cx="200" cy="575" rx="70" ry="60" fill="#1e3010"/>
  <ellipse cx="340" cy="570" rx="90" ry="65" fill="#1e3010"/>
  <ellipse cx="500" cy="578" rx="65" ry="50" fill="#243a14"/>
  <ellipse cx="1150" cy="572" rx="85" ry="58" fill="#1e3010"/>
  <ellipse cx="1300" cy="568" rx="75" ry="62" fill="#1e3010"/>
  <ellipse cx="1450" cy="574" rx="90" ry="55" fill="#243a14"/>
  <ellipse cx="1580" cy="580" rx="70" ry="52" fill="#1e3010"/>

  <!-- Ground -->
  <rect y="600" width="1600" height="300" fill="url(#ground)"/>

  <!-- Sidewalk / road -->
  <rect y="660" width="1600" height="55" fill="url(#road)"/>
  <!-- Road center line -->
  <rect x="0" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="160" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="320" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="480" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="640" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="800" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="960" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="1120" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="1280" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>
  <rect x="1440" y="685" width="120" height="4" fill="#3a3820" opacity="0.6"/>

  <!-- ── LEFT HOUSE (small Cape Cod) ── -->
  <!-- Body -->
  <rect x="80" y="470" width="200" height="200" fill="#2a2218"/>
  <!-- Roof -->
  <polygon points="60,470 180,350 320,470" fill="#1a140e"/>
  <!-- Door -->
  <rect x="160" y="555" width="42" height="115" fill="#1a1208"/>
  <!-- Door knob -->
  <circle cx="198" cy="613" r="4" fill="#5a4820" opacity="0.8"/>
  <!-- Windows -->
  <rect x="90" y="490" width="55" height="50" fill="#3a3020" opacity="0.7"/>
  <!-- Window pane cross -->
  <line x1="117" y1="490" x2="117" y2="540" stroke="#1a1408" stroke-width="3"/>
  <line x1="90" y1="515" x2="145" y2="515" stroke="#1a1408" stroke-width="3"/>
  <rect x="228" y="490" width="55" height="50" fill="#3a3020" opacity="0.7"/>
  <line x1="255" y1="490" x2="255" y2="540" stroke="#1a1408" stroke-width="3"/>
  <line x1="228" y1="515" x2="283" y2="515" stroke="#1a1408" stroke-width="3"/>
  <!-- Chimney -->
  <rect x="240" y="365" width="28" height="65" fill="#2a2018"/>

  <!-- ── CENTER HOUSE (main, Cape Cod) ── -->
  <!-- Body -->
  <rect x="540" y="420" width="320" height="240" fill="#2a2218"/>
  <!-- Roof -->
  <polygon points="510,420 700,270 890,420" fill="#1a140e"/>
  <!-- Attic window in roof -->
  <polygon points="665,330 700,295 735,330" fill="#2a2218"/>
  <rect x="675" y="310" width="50" height="35" fill="#2a2218"/>
  <!-- Door (center) -->
  <rect x="675" y="543" width="50" height="117" fill="#1a1208"/>
  <!-- Door pediment -->
  <polygon points="665,543 700,518 735,543" fill="#1a1208"/>
  <!-- Door knob -->
  <circle cx="719" cy="600" r="5" fill="#5a4820" opacity="0.8"/>
  <!-- Windows main -->
  <rect x="558" y="445" width="70" height="65" fill="#3a3020" opacity="0.7"/>
  <line x1="593" y1="445" x2="593" y2="510" stroke="#1a1408" stroke-width="3"/>
  <line x1="558" y1="477" x2="628" y2="477" stroke="#1a1408" stroke-width="3"/>
  <rect x="772" y="445" width="70" height="65" fill="#3a3020" opacity="0.7"/>
  <line x1="807" y1="445" x2="807" y2="510" stroke="#1a1408" stroke-width="3"/>
  <line x1="772" y1="477" x2="842" y2="477" stroke="#1a1408" stroke-width="3"/>
  <!-- Chimney -->
  <rect x="800" y="283" width="35" height="80" fill="#2a2018"/>

  <!-- ── RIGHT HOUSE (medium) ── -->
  <!-- Body -->
  <rect x="1120" y="455" width="270" height="210" fill="#2a2218"/>
  <!-- Roof -->
  <polygon points="1095,455 1255,320 1415,455" fill="#1a140e"/>
  <!-- Door -->
  <rect x="1234" y="548" width="42" height="117" fill="#1a1208"/>
  <!-- Windows -->
  <rect x="1133" y="476" width="62" height="58" fill="#3a3020" opacity="0.7"/>
  <line x1="1164" y1="476" x2="1164" y2="534" stroke="#1a1408" stroke-width="3"/>
  <line x1="1133" y1="505" x2="1195" y2="505" stroke="#1a1408" stroke-width="3"/>
  <rect x="1342" y="476" width="62" height="58" fill="#3a3020" opacity="0.7"/>
  <line x1="1373" y1="476" x2="1373" y2="534" stroke="#1a1408" stroke-width="3"/>
  <line x1="1342" y1="505" x2="1404" y2="505" stroke="#1a1408" stroke-width="3"/>
  <!-- Chimney -->
  <rect x="1348" y="335" width="28" height="72" fill="#2a2018"/>

  <!-- ── TREES ── -->
  <!-- Left trees -->
  <rect x="305" y="440" width="11" height="225" fill="#1a1008"/>
  <ellipse cx="310" cy="425" rx="45" ry="65" fill="#223816"/>
  <rect x="425" y="460" width="9" height="205" fill="#1a1008"/>
  <ellipse cx="429" cy="447" rx="38" ry="55" fill="#1e3414"/>

  <!-- Center-left trees (between houses) -->
  <rect x="475" y="390" width="11" height="275" fill="#1a1008"/>
  <ellipse cx="480" cy="372" rx="52" ry="72" fill="#223816"/>

  <!-- Center-right trees -->
  <rect x="938" y="400" width="11" height="265" fill="#1a1008"/>
  <ellipse cx="943" cy="383" rx="55" ry="75" fill="#1e3414"/>
  <rect x="1050" y="430" width="9" height="235" fill="#1a1008"/>
  <ellipse cx="1054" cy="416" rx="42" ry="60" fill="#223816"/>

  <!-- Far right trees -->
  <rect x="1418" y="420" width="11" height="245" fill="#1a1008"/>
  <ellipse cx="1423" cy="404" rx="50" ry="68" fill="#223816"/>
  <rect x="1520" y="440" width="10" height="225" fill="#1a1008"/>
  <ellipse cx="1525" cy="426" rx="44" ry="62" fill="#1e3414"/>

  <!-- ── WHITE PICKET FENCE (center-left foreground) ── -->
  <!-- Top rail -->
  <rect x="310" y="577" width="380" height="7" fill="#c8c0a0" opacity="0.75"/>
  <!-- Bottom rail -->
  <rect x="310" y="607" width="380" height="7" fill="#c8c0a0" opacity="0.75"/>
  <!-- Pickets -->
  <g fill="#c8c0a0" opacity="0.75">
    <rect x="310" y="563" width="9" height="58" rx="2"/>
    <rect x="332" y="563" width="9" height="58" rx="2"/>
    <rect x="354" y="563" width="9" height="58" rx="2"/>
    <rect x="376" y="563" width="9" height="58" rx="2"/>
    <rect x="398" y="563" width="9" height="58" rx="2"/>
    <rect x="420" y="563" width="9" height="58" rx="2"/>
    <rect x="442" y="563" width="9" height="58" rx="2"/>
    <rect x="464" y="563" width="9" height="58" rx="2"/>
    <rect x="486" y="563" width="9" height="58" rx="2"/>
    <rect x="508" y="563" width="9" height="58" rx="2"/>
    <rect x="530" y="563" width="9" height="58" rx="2"/>
    <rect x="552" y="563" width="9" height="58" rx="2"/>
    <rect x="574" y="563" width="9" height="58" rx="2"/>
    <rect x="596" y="563" width="9" height="58" rx="2"/>
    <rect x="618" y="563" width="9" height="58" rx="2"/>
    <rect x="640" y="563" width="9" height="58" rx="2"/>
    <rect x="662" y="563" width="9" height="58" rx="2"/>
    <rect x="684" y="563" width="9" height="58" rx="2"/>
  </g>

  <!-- ── AMERICAN FLAG ── -->
  <!-- Flag pole -->
  <rect x="940" y="305" width="5" height="365" fill="#3a3020"/>
  <!-- Flag (simplified stripes) -->
  <rect x="945" y="305" width="100" height="70" fill="#8b1a1a"/>
  <rect x="945" y="315" width="100" height="10" fill="#c8c0a0" opacity="0.8"/>
  <rect x="945" y="330" width="100" height="10" fill="#8b1a1a"/>
  <rect x="945" y="345" width="100" height="10" fill="#c8c0a0" opacity="0.8"/>
  <rect x="945" y="360" width="100" height="15" fill="#8b1a1a"/>
  <!-- Blue canton -->
  <rect x="945" y="305" width="44" height="36" fill="#2a4070" opacity="0.9"/>
  <!-- Stars (simplified dots) -->
  <g fill="white" opacity="0.8">
    <circle cx="953" cy="311" r="2"/><circle cx="963" cy="311" r="2"/><circle cx="973" cy="311" r="2"/>
    <circle cx="958" cy="317" r="2"/><circle cx="968" cy="317" r="2"/><circle cx="978" cy="317" r="2"/>
    <circle cx="953" cy="323" r="2"/><circle cx="963" cy="323" r="2"/><circle cx="973" cy="323" r="2"/>
    <circle cx="958" cy="329" r="2"/><circle cx="968" cy="329" r="2"/>
    <circle cx="953" cy="335" r="2"/><circle cx="963" cy="335" r="2"/><circle cx="973" cy="335" r="2"/>
  </g>

  <!-- ── 1950s CAR (lower left) ── -->
  <!-- Body -->
  <rect x="100" y="596" width="220" height="52" rx="8" fill="#2a2018"/>
  <!-- Cabin/roof -->
  <rect x="138" y="565" width="145" height="42" rx="12" fill="#222016"/>
  <!-- Hood -->
  <polygon points="100,596 320,596 310,620 100,620" fill="#2a2018"/>
  <!-- Windshield -->
  <rect x="145" y="570" width="130" height="28" rx="4" fill="#1e1c14" opacity="0.7"/>
  <!-- Chrome bumpers -->
  <rect x="95" y="630" width="235" height="8" rx="3" fill="#4a4030" opacity="0.6"/>
  <!-- Wheels -->
  <circle cx="165" cy="648" r="28" fill="#1a1408"/>
  <circle cx="165" cy="648" r="14" fill="#2a2218"/>
  <circle cx="285" cy="648" r="28" fill="#1a1408"/>
  <circle cx="285" cy="648" r="14" fill="#2a2218"/>
  <!-- Tail fins (1950s) -->
  <polygon points="320,570 350,570 320,608" fill="#2a2018"/>

  <!-- ── CHILD FIGURE (center yard) ── -->
  <circle cx="860" cy="602" r="13" fill="#1a1408"/>
  <!-- Body -->
  <line x1="860" y1="615" x2="860" y2="648" stroke="#1a1408" stroke-width="8"/>
  <!-- Arms (raised/playing) -->
  <line x1="860" y1="622" x2="838" y2="612" stroke="#1a1408" stroke-width="6"/>
  <line x1="860" y1="622" x2="882" y2="610" stroke="#1a1408" stroke-width="6"/>
  <!-- Legs -->
  <line x1="860" y1="648" x2="845" y2="672" stroke="#1a1408" stroke-width="7"/>
  <line x1="860" y1="648" x2="876" y2="672" stroke="#1a1408" stroke-width="7"/>

  <!-- ── CLOUDS (subtle) ── -->
  <g opacity="0.25" fill="#c8c0a0">
    <ellipse cx="300" cy="180" rx="120" ry="35"/>
    <ellipse cx="350" cy="172" rx="80" ry="28"/>
    <ellipse cx="260" cy="190" rx="70" ry="25"/>
    <ellipse cx="900" cy="140" rx="150" ry="38"/>
    <ellipse cx="960" cy="130" rx="90" ry="30"/>
    <ellipse cx="840" cy="155" rx="80" ry="28"/>
    <ellipse cx="1350" cy="200" rx="110" ry="32"/>
    <ellipse cx="1410" cy="190" rx="75" ry="26"/>
  </g>

  <!-- Film grain overlay -->
  <rect width="1600" height="900" opacity="0.06" fill="white" filter="url(#grain)"/>

  <!-- Vignette -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
