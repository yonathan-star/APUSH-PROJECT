<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark desk surface -->
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0c08"/>
      <stop offset="100%" stop-color="#060402"/>
    </linearGradient>
    <!-- Paper gradient for documents -->
    <linearGradient id="paper-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c898"/>
      <stop offset="100%" stop-color="#b8a878"/>
    </linearGradient>
    <linearGradient id="paper-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b888"/>
      <stop offset="100%" stop-color="#a89868"/>
    </linearGradient>
    <!-- Spotlight on desk -->
    <radialGradient id="desk-light" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#2a2210" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
      <stop offset="20%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>
    <!-- Film grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay"/>
    </filter>
    <!-- Paper grain -->
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.58  0 0 0 0.12 0" in="noise" result="coloredNoise"/>
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Dark background (room/desk) -->
  <rect width="1600" height="900" fill="url(#desk)"/>

  <!-- Desk surface (lighter center area) -->
  <rect width="1600" height="900" fill="url(#desk-light)"/>

  <!-- ── DOCUMENT STACK — BACK PAGES ── -->

  <!-- Document 5 (furthest back, most tilted) -->
  <g transform="rotate(12, 800, 450)">
    <rect x="350" y="100" width="680" height="880" fill="url(#paper-back)" rx="2" opacity="0.7"/>
    <line x1="370" y1="160" x2="1010" y2="160" stroke="#8a7848" stroke-width="0.8" opacity="0.4"/>
    <line x1="370" y1="200" x2="1010" y2="200" stroke="#8a7848" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Document 4 -->
  <g transform="rotate(7, 800, 450)">
    <rect x="370" y="110" width="680" height="870" fill="url(#paper-back)" rx="2" opacity="0.75"/>
    <text x="710" y="175" font-family="'Courier New', monospace" font-size="11" fill="#2a2010" text-anchor="middle" opacity="0.6" letter-spacing="2">DEPARTMENT OF DEFENSE</text>
    <line x1="390" y1="195" x2="1030" y2="195" stroke="#8a7848" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- Document 3 -->
  <g transform="rotate(-8, 800, 450)">
    <rect x="380" y="105" width="680" height="860" fill="url(#paper-back)" rx="2" opacity="0.8"/>
    <!-- Some text lines -->
    <g fill="#1e1808" opacity="0.5" font-family="'Courier New', monospace" font-size="10">
      <text x="405" y="172">SUBJECT: ACTIVITIES IN SOUTHEAST ASIA</text>
      <text x="405" y="192">CLASSIFICATION: TOP SECRET — SENSITIVE</text>
      <text x="405" y="220">1. The following summarizes actions taken between</text>
      <text x="405" y="238">   1964 and 1968 with respect to military operations</text>
      <text x="405" y="256">   in the Republic of Vietnam...</text>
    </g>
  </g>

  <!-- Document 2 (slightly back) -->
  <g transform="rotate(-4, 800, 450)">
    <rect x="365" y="98" width="700" height="860" fill="url(#paper-main)" rx="2" opacity="0.88"/>
    <!-- Document content -->
    <rect x="385" y="118" width="660" height="820" fill="none" stroke="#8a7848" stroke-width="0.8" opacity="0.25"/>
    <g fill="#1a1608" opacity="0.55" font-family="'Courier New', monospace">
      <text x="715" y="158" font-size="13" text-anchor="middle" letter-spacing="3" font-weight="bold">TOP SECRET — SENSITIVE</text>
      <text x="715" y="180" font-size="10" text-anchor="middle" letter-spacing="1">HISTORY OF U.S. DECISION-MAKING REGARDING</text>
      <text x="715" y="196" font-size="10" text-anchor="middle" letter-spacing="1">VIETNAM POLICY</text>
      <line x1="385" y1="210" x2="1045" y2="210" stroke="#8a7848" stroke-width="1" opacity="0.35"/>
      <text x="400" y="240" font-size="9">Chapter 4: The Escalation Decisions, 1964</text>
      <text x="400" y="260" font-size="9">...</text>
      <text x="400" y="280" font-size="9">The administration, while publicly expressing</text>
      <text x="400" y="298" font-size="9">optimism regarding the course of the conflict,</text>
      <text x="400" y="316" font-size="9">was privately informed by senior officials that</text>
      <text x="400" y="334" font-size="9">the military situation was deteriorating rapidly.</text>
      <text x="400" y="360" font-size="9">McNamara's assessment of November 1967 states:</text>
      <text x="400" y="378" font-size="9">"The war is not going well..."</text>
    </g>
  </g>

  <!-- ── MAIN FRONT DOCUMENT ── -->
  <rect x="360" y="90" width="710" height="860" fill="url(#paper-main)" rx="2" filter="url(#paper-grain)"/>

  <!-- Document border -->
  <rect x="378" y="108" width="674" height="824" fill="none" stroke="#8a6848" stroke-width="1.5" opacity="0.4"/>
  <rect x="385" y="115" width="660" height="810" fill="none" stroke="#8a6848" stroke-width="0.5" opacity="0.25"/>

  <!-- ── FRONT DOCUMENT CONTENT ── -->

  <!-- Classification header -->
  <rect x="378" y="108" width="674" height="28" fill="#d0b878" opacity="0.5"/>
  <text x="715" y="128" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#1a0808" text-anchor="middle" letter-spacing="3" opacity="0.85">TOP SECRET — SENSITIVE</text>

  <!-- Main heading area -->
  <text x="715" y="170" font-family="'Courier New', monospace" font-size="11" fill="#1a1408" text-anchor="middle" letter-spacing="2" opacity="0.8">UNITED STATES — VIETNAM RELATIONS</text>
  <text x="715" y="188" font-family="'Courier New', monospace" font-size="11" fill="#1a1408" text-anchor="middle" letter-spacing="2" opacity="0.8">1945 — 1968</text>

  <!-- Subheading -->
  <text x="715" y="212" font-family="'Courier New', monospace" font-size="9" fill="#2a2010" text-anchor="middle" opacity="0.65">Study prepared by the Office of the Secretary of Defense</text>

  <line x1="390" y1="225" x2="1040" y2="225" stroke="#8a6848" stroke-width="1" opacity="0.4"/>

  <!-- Body text (simulated typewriter content) -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#1a1408" opacity="0.65">
    <text x="395" y="252">FOREWORD:</text>
    <text x="395" y="270">This study was commissioned by Secretary McNamara in June 1967</text>
    <text x="395" y="286">to examine the decision-making process regarding Vietnam from</text>
    <text x="395" y="302">the Truman administration through the present. It is based on</text>
    <text x="395" y="318">classified documents of the highest sensitivity. The findings</text>
    <text x="395" y="334">contained herein represent a comprehensive record of United</text>
    <text x="395" y="350">States government policy and actions in Southeast Asia.</text>
    <text x="395" y="375">The record shows a consistent pattern of decisions made</text>
    <text x="395" y="391">without full disclosure to Congress or the American public.</text>
    <text x="395" y="407">Specifically:</text>
    <text x="395" y="430">  1. The Gulf of Tonkin resolution was based on incomplete</text>
    <text x="395" y="446">     and in some cases erroneous intelligence reporting.</text>
    <text x="395" y="462">  2. The administration's public optimism was not shared</text>
    <text x="395" y="478">     in private assessments at the highest levels.</text>
    <text x="395" y="494">  3. Escalation decisions were made with awareness that</text>
    <text x="395" y="510">     the stated military objectives were unachievable.</text>
    <text x="395" y="535">     [MATERIAL CLASSIFIED — ACCESS RESTRICTED]</text>
    <text x="395" y="560">     ___________________________________________________</text>
    <text x="395" y="580">     ___________________________________________________</text>
    <text x="395" y="600">     ___________________________________________________</text>
    <text x="395" y="625">Section 6: The escalation recommendations of 1965...</text>
    <text x="395" y="641">The decision to commit ground troops to Vietnam was made</text>
    <text x="395" y="657">against the advice of several senior advisors who warned</text>
    <text x="395" y="673">that the war could not be won without measures Congress</text>
    <text x="395" y="689">and the public would not support.</text>
  </g>

  <!-- Classification footer -->
  <rect x="378" y="900" width="674" height="28" fill="#d0b878" opacity="0.5" transform="translate(0,-50)"/>
  <text x="715" y="868" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#1a0808" text-anchor="middle" letter-spacing="3" opacity="0.85">TOP SECRET — SENSITIVE</text>
  <text x="715" y="885" font-family="'Courier New', monospace" font-size="8" fill="#1a0808" text-anchor="middle" opacity="0.6">COPY NO. ___  |  HANDLE VIA BYEMAN CHANNELS ONLY</text>

  <!-- ── TOP SECRET STAMP ── -->
  <g transform="translate(860, 450) rotate(-22)">
    <rect x="-110" y="-30" width="220" height="62" fill="none" stroke="#7a0808" stroke-width="4" rx="4" opacity="0.8"/>
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#7a0808" text-anchor="middle" opacity="0.85" letter-spacing="3">TOP SECRET</text>
    <text x="0" y="22" font-family="'Courier New', monospace" font-size="13" fill="#7a0808" text-anchor="middle" opacity="0.8" letter-spacing="4">SENSITIVE</text>
  </g>

  <!-- Film grain -->
  <rect width="1600" height="900" opacity="0.06" fill="white" filter="url(#grain)"/>

  <!-- Vignette (dark edges, focused on documents) -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
