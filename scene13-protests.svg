<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dramatic overcast sky -->
    <linearGradient id="protest-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e28"/>
      <stop offset="50%" stop-color="#2a3040"/>
      <stop offset="100%" stop-color="#3a3828"/>
    </linearGradient>
    <!-- Ground/crowd base -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c14"/>
      <stop offset="100%" stop-color="#100e08"/>
    </linearGradient>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="10%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Film grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#protest-sky)"/>

